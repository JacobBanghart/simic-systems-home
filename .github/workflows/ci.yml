name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node (and terraform) versions come from mise.toml, same as local.
      - uses: jdx/mise-action@v2
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
