name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun, Node and Terraform versions come from mise.toml, same as local.
      # Bun is the package manager/script runner; tools still run on Node.
      - uses: jdx/mise-action@v2
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # `bun run test` (Vitest), not `bun test` (Bun's own runner).
      - run: bun run test

      - run: bun run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
