name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun, Node and Terraform versions come from mise.toml, same as local.
      # Bun is the package manager/script runner; tools still run on Node.
      - uses: jdx/mise-action@v2
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # `bun run test` (Vitest), not `bun test` (Bun's own runner).
      - run: bun run test

      - run: bun run check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Offline Terraform checks: formatting and validity only. No backend, no
  # credentials, no plan (the drift workflow owns anything that touches Stripe).
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [stripe, cloudflare, github-ci]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      # Installs the terraform version pinned in mise.toml.
      - uses: jdx/mise-action@v2
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - run: terraform fmt -check -recursive -diff

      - run: terraform init -backend=false -input=false -no-color

      - run: terraform validate -no-color
